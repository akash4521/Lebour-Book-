name: Lebour Book Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Find project folder
        run: |
          PROJECT=$(find project -name package.json -printf '%h\n' | head -1)
          if [ -z "$PROJECT" ]; then
            echo "package.json not found"
            exit 1
          fi
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT }}
        run: npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT }}
        run: npx cap add android

      - name: Sync Android
        working-directory: ${{ env.PROJECT }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lebour-Book-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
