name: Lebour Book Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Download Lebour Book ZIP
        run: |
          curl -fL "https://raw.githubusercontent.com/akash4521/Lebour-Book/main/Lebour-Book-GitHub-Ready.zip" -o lebour-book.zip
          ls -lh lebour-book.zip
          unzip -o lebour-book.zip -d project

      - name: Find project folder
        run: |
          PROJECT=$(find project -type f -name package.json -printf '%h\n' | head -1)

          if [ -z "$PROJECT" ]; then
            echo "package.json not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project folder: $PROJECT"

      - name: Fix TypeScript errors
        working-directory: ${{ env.PROJECT }}
        run: |
          cat > src/vite-env.d.ts <<'EOF'
          /// <reference types="vite/client" />
          EOF

          sed -i 's/as T\[\])/as T)/' src/lib/db.ts

          echo "TypeScript fixes applied:"
          cat src/vite-env.d.ts
          grep -n "as T" src/lib/db.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT }}
        run: npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT }}
        run: npx cap add android

      - name: Sync Android
        working-directory: ${{ env.PROJECT }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lebour-Book-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
