name: Lebour Book Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Lebour-Book-GitHub-Ready.zip -d project
          PROJECT=$(find project -name package.json -printf '%h\n' | head -1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: npm install

      - name: Build web app
        working-directory: ${{ env.PROJECT }}
        run: npm run build

      - name: Add Android
        working-directory: ${{ env.PROJECT }}
        run: npx cap add android

      - name: Sync Android
        working-directory: ${{ env.PROJECT }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT }}/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lebour-Book-APK
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/app-debug.apk
